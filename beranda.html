<script>
    let currentSlide = 1;
    let totalSlides = 0;

    // DAFTAR URUTAN TAB DENGAN FILE KONTENNYA
    const tabsList = [
        'beranda.html',
        'visi-pribadi.html',
        'refleksi-pengalaman.html',
        'karya-inovasi.html'
    ];

    let currentTabIndex = 0;

    // LOAD FILE KONTEN KE DALAM CONTAINER MAIN
    async function loadTabContent(filePath) {
        try {
            const response = await fetch(filePath);
            if (!response.ok) throw new Error('Gagal memuat file konten.');
            const html = await response.text();
            document.getElementById('presentation-container').innerHTML = html;
            
            // Perbarui Indeks Tab Aktif
            currentTabIndex = tabsList.indexOf(filePath);

            // Tampilkan / Sembunyikan Tombol Panah Navigasi khusus Tab Beranda
            const prevBtn = document.querySelector('button[onclick="prevSlide()"]');
            const nextBtn = document.querySelector('button[onclick="nextSlide()"]');
            if (prevBtn) prevBtn.style.display = filePath.includes('beranda') ? 'none' : 'flex';
            if (nextBtn) nextBtn.style.display = filePath.includes('beranda') ? 'none' : 'flex';

            // Hitung Ulang Total Slide
            const slides = document.querySelectorAll('.slide-view');
            totalSlides = slides.length;
            currentSlide = 1;
            updateSlideUI();
        } catch (error) {
            document.getElementById('presentation-container').innerHTML = `
                <div class="clean-card rounded-2xl p-8 text-center flex items-center justify-center w-full">
                    <p class="text-slate-500 font-bold">Konten ${filePath} belum dapat dimuat atau file tidak ditemukan.</p>
                </div>
            `;
        }
    }

    // PERALIHAN TAB SECARA MANUAL
    function switchTab(filePath, btnElement) {
        updateTabButtonsUI(filePath);
        loadTabContent(filePath);
    }

    // UPDATE TAMPILAN TOMBOL TAB DI HEADER
    function updateTabButtonsUI(filePath) {
        const tabBtns = document.querySelectorAll('.tab-btn');
        tabBtns.forEach(btn => {
            const isBeranda = btn.ariaLabel === "Beranda";
            const btnTargetFile = isBeranda ? 'beranda.html' : 
                (btn.textContent.includes('Visi') ? 'visi-pribadi.html' : 
                (btn.textContent.includes('Refleksi') ? 'refleksi-pengalaman.html' : 'karya-inovasi.html'));

            if (btnTargetFile === filePath) {
                btn.className = isBeranda 
                    ? 'tab-btn active p-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white shadow-sm transition-all cursor-pointer flex items-center justify-center'
                    : 'tab-btn active px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white shadow-sm transition-all cursor-pointer whitespace-nowrap';
            } else {
                btn.className = isBeranda 
                    ? 'tab-btn p-1.5 rounded-lg text-xs font-bold text-slate-500 hover:text-blue-600 hover:bg-slate-50 transition-all cursor-pointer flex items-center justify-center'
                    : 'tab-btn px-3 py-1.5 rounded-lg text-xs font-bold text-slate-500 hover:text-blue-600 hover:bg-slate-50 transition-all cursor-pointer whitespace-nowrap';
            }
        });
    }

    // UPDATE TAMPILAN SLIDE AKTIFF
    function updateSlideUI() {
        const slides = document.querySelectorAll('.slide-view');
        slides.forEach((slide, index) => {
            if (index + 1 === currentSlide) {
                slide.classList.add('active');
            } else {
                slide.classList.remove('active');
            }
        });
        window.scrollTo({ top: 0 });
    }

    // LOGIKA TOMBOL PANAH BERIKUTNYA (SWITCH TAB OTOMATIS)
    function nextSlide() {
        if (totalSlides === 0) return;

        if (currentSlide < totalSlides) {
            // Pindah ke slide berikutnya di tab yang sama
            currentSlide++;
            updateSlideUI();
        } else {
            // Jika sudah slide terakhir, beralih ke tab selanjutnya
            const nextTabIndex = (currentTabIndex + 1) % tabsList.length;
            const nextFilePath = tabsList[nextTabIndex];
            updateTabButtonsUI(nextFilePath);
            loadTabContent(nextFilePath);
        }
    }

    // LOGIKA TOMBOL PANAH SEBELUMNYA (BALIK TAB OTOMATIS)
    function prevSlide() {
        if (totalSlides === 0) return;

        if (currentSlide > 1) {
            // Pindah ke slide sebelumnya di tab yang sama
            currentSlide--;
            updateSlideUI();
        } else {
            // Jika slide pertama, beralih ke tab sebelumnya
            const prevTabIndex = (currentTabIndex - 1 + tabsList.length) % tabsList.length;
            const prevFilePath = tabsList[prevTabIndex];
            updateTabButtonsUI(prevFilePath);
            loadTabContent(prevFilePath);
        }
    }

    // TOGGLE FULLSCREEN
    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch((err) => {
                alert(`Gagal mengaktifkan layar penuh: ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    // UNDUH SELURUH SLIDE KE FORMAT PDF RASIO 16:9
    function downloadPDF() {
        const element = document.getElementById('presentation-container');
        document.body.classList.add('pdf-export-mode');

        const opt = {
            margin:       0,
            filename:     'Presentasi_Portofolio_16x9.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { 
                scale: 2, 
                useCORS: true,
                logging: false,
                windowWidth: 1000
            },
            jsPDF:        { 
                unit: 'mm', 
                format: [297, 167.06], 
                orientation: 'landscape' 
            }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            document.body.classList.remove('pdf-export-mode');
            updateSlideUI();
        });
    }

    // NAVIGASI KEYBOARD (PANAH KIRI & KANAN)
    document.addEventListener('keydown', function(event) {
        if (event.key === "ArrowRight") {
            nextSlide();
        } else if (event.key === "ArrowLeft") {
            prevSlide();
        }
    });

    // MUAT TAB BERANDA SECARA DEFAULT SAAT PERTAMA KALI DIBUKA
    window.addEventListener('DOMContentLoaded', () => {
        loadTabContent('beranda.html');
    });
</script>
