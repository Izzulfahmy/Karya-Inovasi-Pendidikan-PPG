<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio & Karya Inovasi - PPG Calon Guru</title>
    <!-- Favicon / Logo Tab -->
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc;
        }
        
        h1, h2, h3, h4, .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        /* Styling Tab Aktif & Non-Aktif */
        .tab-button {
            transition: all 0.25s ease-in-out;
            position: relative;
        }

        .tab-button.active {
            background-color: #ffffff;
            color: #2563eb;
            font-weight: 800;
            box-shadow: 0 4px 12px -2px rgba(37, 99, 235, 0.12), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            border-color: #e2e8f0;
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 12px;
            right: 12px;
            height: 3px;
            background-color: #2563eb;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

    <!-- HEADER & SEAMLESS TAB NAVIGATION -->
    <header class="w-full max-w-6xl mx-auto pt-4 sm:pt-6 px-3 sm:px-6 z-40">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
            <div>
                <span class="text-[11px] font-black tracking-widest text-blue-600 uppercase">Portofolio Digital PPG</span>
                <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight">Muhammad Izzul Fahmi, S.Pd.</h1>
            </div>
            
            <!-- SEAMLESS TAB BAR -->
            <nav class="p-1 rounded-2xl bg-slate-200/70 backdrop-blur-md border border-slate-300/60 inline-flex items-center gap-1 self-start sm:self-auto shadow-inner">
                <button onclick="switchTab('visi-pribadi.html', this)" class="tab-button px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:text-slate-900 border border-transparent cursor-pointer">
                    Visi Pribadi
                </button>
                <button onclick="switchTab('refleksi-pengalaman.html', this)" class="tab-button px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:text-slate-900 border border-transparent cursor-pointer">
                    Refleksi Pengalaman Belajar
                </button>
                <button onclick="switchTab('karya-inovasi.html', this)" class="tab-button active px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:text-slate-900 border border-transparent cursor-pointer">
                    Karya Inovasi Pendidikan
                </button>
            </nav>
        </div>
    </header>

    <!-- WADAH KONTEN TAB (IFRAME RESPONSIVE) -->
    <main class="w-full max-w-6xl mx-auto px-2 sm:px-6 flex-grow flex items-center justify-center my-2">
        <iframe 
            id="tab-frame" 
            src="karya-inovasi.html" 
            class="w-full h-[620px] sm:h-[650px] border-0 rounded-2xl bg-transparent transition-opacity duration-300"
            title="Konten Presentasi">
        </iframe>
    </main>

    <!-- FOOTER SEDERHANA -->
    <footer class="w-full text-center py-3 text-xs font-medium text-slate-400">
        &copy; 2026 Muhammad Izzul Fahmi, S.Pd. &bull; PPG Calon Guru PGSD Universitas Negeri Jember
    </footer>

    <!-- SCRIPT LOGIKA PERPINDAHAN TAB SEAMLESS -->
    <script>
        function switchTab(pageUrl, buttonElement) {
            const frame = document.getElementById('tab-frame');
            
            // Transisi halus saat ganti konten
            frame.style.opacity = '0';

            setTimeout(() => {
                frame.src = pageUrl;
                frame.onload = () => {
                    frame.style.opacity = '1';
                };
            }, 150);

            // Update status kelas tombol tab
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            buttonElement.classList.add('active');
        }
    </script>
</body>
</html>
