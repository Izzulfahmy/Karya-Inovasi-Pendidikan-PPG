<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio & Karya Inovasi Pendidikan</title>
    <!-- Favicon / Logo Tab -->
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2pdf CDN untuk Cetak ke PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc;
        }
        
        h1, h2, h3, h4, .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        /* Clean Card Design dengan Ukuran Tinggi Seragam */
        .clean-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(148, 163, 184, 0.1), 0 8px 10px -6px rgba(148, 163, 184, 0.1);
            min-height: 580px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Slide View Management */
        .slide-view {
            display: none;
            width: 100%;
        }

        .slide-view.active {
            display: block;
        }

        /* STYLING KHUSUS PROSES EXPORT PDF (PRESISI 100% PERSIS WEBSITE) */
        #pdf-export-container {
            position: absolute;
            top: -99999px;
            left: -99999px;
            width: 1150px;
        }

        .pdf-page-wrapper {
            width: 1150px !important;
            height: 646px !important; /* Rasio 16:9 Presisi (1150px x 646px) */
            box-sizing: border-box !important;
            padding: 16px 24px !important;
            background-color: #f8fafc !important;
            page-break-after: always !important;
            page-break-inside: avoid !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: space-between !important;
            overflow: hidden !important;
        }

        .pdf-page-wrapper .slide-view {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
        }

        .pdf-page-wrapper .clean-card {
            width: 100% !important;
            height: 100% !important;
            min-height: 100% !important;
            max-height: 100% !important;
            border-radius: 16px !important;
            box-shadow: none !important;
            border: 1px solid #e2e8f0 !important;
            padding: 1.5rem !important;
            box-sizing: border-box !important;
            background: #ffffff !important;
        }

        /* Sembunyikan Blob Berat Saat Render Gambar PDF */
        .pdf-page-wrapper .bg-blob-1,
        .pdf-page-wrapper .bg-blob-2 {
            display: none !important;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col items-center justify-between relative px-2 sm:px-6 py-2 selection:bg-blue-600 selection:text-white">

    <!-- HEADER / CONTROL BAR -->
    <header id="main-header" class="w-full max-w-6xl mx-auto flex items-center justify-between gap-2 z-50 mb-1.5">
        
        <!-- POJOK KIRI ATAS: LOGO BERURUTAN (SEUKURAN TOMBOL TAB) -->
        <div class="flex items-center gap-1.5 p-1 rounded-xl border border-slate-200/80 bg-white/90 backdrop-blur-md shadow-sm">
            <img src="logo.png" alt="Logo" class="h-7 w-auto object-contain" />
            <img src="tutwuri.png" alt="Tut Wuri Handayani" class="h-7 w-auto object-contain" />
            <img src="dikti.jpg" alt="Dikti" class="h-7 w-auto object-contain" />
            <img src="fkip.jpg" alt="FKIP" class="h-7 w-auto object-contain" />
            <img src="ppg.png" alt="PPG" class="h-7 w-auto object-contain" />
        </div>

        <!-- TAB NAVIGASI SEAMLESS DIBUAT DITENGAH -->
        <nav class="flex items-center gap-1 p-1 rounded-xl border border-slate-200/80 bg-white/90 backdrop-blur-md shadow-sm">
            <!-- TAB BERANDA DENGAN IKON RUMAH -->
            <button onclick="switchTab('beranda.html', this)" aria-label="Beranda" title="Beranda" class="tab-btn active p-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white shadow-sm transition-all cursor-pointer flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                </svg>
            </button>
            <button onclick="switchTab('visi-pribadi.html', this)" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-bold text-slate-500 hover:text-blue-600 hover:bg-slate-50 transition-all cursor-pointer whitespace-nowrap">
                Visi Pribadi
            </button>
            <button onclick="switchTab('refleksi-pengalaman.html', this)" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-bold text-slate-500 hover:text-blue-600 hover:bg-slate-50 transition-all cursor-pointer whitespace-nowrap">
                Refleksi Pengalaman Belajar
            </button>
            <button onclick="switchTab('karya-inovasi.html', this)" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-bold text-slate-500 hover:text-blue-600 hover:bg-slate-50 transition-all cursor-pointer whitespace-nowrap">
                Karya Inovasi Pendidikan
            </button>
        </nav>

        <!-- POJOK KANAN: TOMBOL UNDUH PDF & FULLSCREEN -->
        <div class="flex items-center gap-1.5">
            <!-- Tombol Unduh PDF -->
            <button id="btn-download-pdf" onclick="downloadPDF()" aria-label="Unduh PDF" title="Unduh Seluruh Slide (PDF Presisi Tampilan Web)" class="p-1.5 rounded-xl border border-slate-200/80 bg-white/90 backdrop-blur-md text-slate-500 hover:text-blue-600 hover:bg-white hover:shadow-md transition-all active:scale-95 cursor-pointer flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
                </svg>
            </button>

            <!-- Tombol Fullscreen -->
            <button onclick="toggleFullScreen()" aria-label="Layar Penuh" title="Layar Penuh" class="p-1.5 rounded-xl border border-slate-200/80 bg-white/90 backdrop-blur-md text-slate-500 hover:text-blue-600 hover:bg-white hover:shadow-md transition-all active:scale-95 cursor-pointer flex items-center justify-center">
                <svg id="fullscreen-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
                </svg>
            </button>
        </div>
    </header>

    <!-- NAVIGASI PANAH TIPIS MENGAPUNG (KIRI & KANAN) -->
    <button onclick="prevSlide()" aria-label="Sebelumnya" class="fixed left-1 sm:left-3 top-1/2 -translate-y-1/2 z-50 w-8 h-10 sm:w-10 sm:h-12 flex items-center justify-center text-slate-400 hover:text-blue-600 hover:bg-white hover:shadow-xl rounded-xl border border-slate-200/60 bg-white/80 backdrop-blur-md transition-all active:scale-90 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
        </svg>
    </button>

    <button onclick="nextSlide()" aria-label="Berikutnya" class="fixed right-1 sm:right-3 top-1/2 -translate-y-1/2 z-50 w-8 h-10 sm:w-10 sm:h-12 flex items-center justify-center text-slate-400 hover:text-blue-600 hover:bg-white hover:shadow-xl rounded-2xl border border-slate-200/60 bg-white/80 backdrop-blur-md transition-all active:scale-90 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
        </svg>
    </button>

    <!-- CONTAINER UTAMA UNTUK KONTEN TAB DARI FILE EXTERNAL -->
    <main id="presentation-container" class="w-full max-w-6xl mx-auto my-auto flex-grow flex items-center justify-center">
        <!-- Konten dimuat secara dinamis via fetch/JavaScript -->
    </main>

    <!-- CONTAINER HIDDEN UNTUK PROSES RENDER EKSPOR PDF ALL SLIDES -->
    <div id="pdf-export-container"></div>

    <!-- SCRIPT NAVIGASI, SWITCH TAB & PERBAIKAN EKSPOR PDF 100% PRESISI -->
    <script>
        let currentSlide = 1;
        let totalSlides = 0;

        // DAFTAR URUTAN TAB KONTEN & NAMA TAB UNTUK HEADER PDF
        const tabsList = [
            { file: 'beranda.html', name: 'Beranda' },
            { file: 'visi-pribadi.html', name: 'Visi Pribadi' },
            { file: 'refleksi-pengalaman.html', name: 'Refleksi Pengalaman' },
            { file: 'karya-inovasi.html', name: 'Karya Inovasi' }
        ];

        let currentTabIndex = 0;

        // LOAD FILE KONTEN KE DALAM CONTAINER MAIN
        async function loadTabContent(filePath) {
            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error('Gagal memuat file konten.');
                const html = await response.text();
                document.getElementById('presentation-container').innerHTML = html;
                
                // Perbarui Indeks Tab Aktif
                currentTabIndex = tabsList.findIndex(t => t.file === filePath);

                // Tampilkan / Sembunyikan Tombol Panah Navigasi khusus Tab Beranda
                const prevBtn = document.querySelector('button[onclick="prevSlide()"]');
                const nextBtn = document.querySelector('button[onclick="nextSlide()"]');
                if (prevBtn) prevBtn.style.display = filePath.includes('beranda') ? 'none' : 'flex';
                if (nextBtn) nextBtn.style.display = filePath.includes('beranda') ? 'none' : 'flex';

                // Hitung Ulang Total Slide
                const slides = document.querySelectorAll('#presentation-container .slide-view');
                totalSlides = slides.length;
                currentSlide = 1;
                updateSlideUI();
            } catch (error) {
                document.getElementById('presentation-container').innerHTML = `
                    <div class="clean-card rounded-2xl p-8 text-center flex items-center justify-center w-full">
                        <p class="text-slate-500 font-bold">Konten ${filePath} belum dapat dimuat atau file tidak ditemukan.</p>
                    </div>
                `;
            }
        }

        // PERALIHAN TAB SECARA MANUAL
        function switchTab(filePath, btnElement) {
            updateTabButtonsUI(filePath);
            loadTabContent(filePath);
        }

        // UPDATE TAMPILAN TOMBOL TAB DI HEADER
        function updateTabButtonsUI(filePath) {
            const tabBtns = document.querySelectorAll('.tab-btn');
            tabBtns.forEach(btn => {
                const isBeranda = btn.ariaLabel === "Beranda";
                const btnTargetFile = isBeranda ? 'beranda.html' : 
                    (btn.textContent.includes('Visi') ? 'visi-pribadi.html' : 
                    (btn.textContent.includes('Refleksi') ? 'refleksi-pengalaman.html' : 'karya-inovasi.html'));

                if (btnTargetFile === filePath) {
                    btn.className = isBeranda 
                        ? 'tab-btn active p-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white shadow-sm transition-all cursor-pointer flex items-center justify-center'
                        : 'tab-btn active px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white shadow-sm transition-all cursor-pointer whitespace-nowrap';
                } else {
                    btn.className = isBeranda 
                        ? 'tab-btn p-1.5 rounded-lg text-xs font-bold text-slate-500 hover:text-blue-600 hover:bg-slate-50 transition-all cursor-pointer flex items-center justify-center'
                        : 'tab-btn px-3 py-1.5 rounded-lg text-xs font-bold text-slate-500 hover:text-blue-600 hover:bg-slate-50 transition-all cursor-pointer whitespace-nowrap';
                }
            });
        }

        // UPDATE TAMPILAN SLIDE AKTIF
        function updateSlideUI() {
            const slides = document.querySelectorAll('#presentation-container .slide-view');
            slides.forEach((slide, index) => {
                if (index + 1 === currentSlide) {
                    slide.classList.add('active');
                } else {
                    slide.classList.remove('active');
                }
            });
            window.scrollTo({ top: 0 });
        }

        // LOGIKA TOMBOL PANAH BERIKUTNYA
        function nextSlide() {
            if (totalSlides === 0) return;

            if (currentSlide < totalSlides) {
                currentSlide++;
                updateSlideUI();
            } else {
                const nextTabIndex = (currentTabIndex + 1) % tabsList.length;
                const nextFilePath = tabsList[nextTabIndex].file;
                updateTabButtonsUI(nextFilePath);
                loadTabContent(nextFilePath);
            }
        }

        // LOGIKA TOMBOL PANAH SEBELUMNYA
        function prevSlide() {
            if (totalSlides === 0) return;

            if (currentSlide > 1) {
                currentSlide--;
                updateSlideUI();
            } else {
                const prevTabIndex = (currentTabIndex - 1 + tabsList.length) % tabsList.length;
                const prevFilePath = tabsList[prevTabIndex].file;
                updateTabButtonsUI(prevFilePath);
                loadTabContent(prevFilePath);
            }
        }

        // TOGGLE FULLSCREEN
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                    alert(`Gagal mengaktifkan layar penuh: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // DOKUMEN UNDUH PDF PERSIS SAMA DENGAN TAMPILAN WEBSITE
        async function downloadPDF() {
            const btnDownload = document.getElementById('btn-download-pdf');
            const originalBtnHtml = btnDownload.innerHTML;
            
            try {
                // Tampilkan Loading Indicator
                btnDownload.disabled = true;
                btnDownload.innerHTML = `
                    <svg class="animate-spin h-4 w-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                `;

                const pdfContainer = document.getElementById('pdf-export-container');
                pdfContainer.innerHTML = '';

                // Buat Elemen Header Khusus untuk Setiap Halaman PDF
                function createPdfHeader(activeTabName) {
                    const headerDiv = document.createElement('div');
                    headerDiv.className = 'w-full flex items-center justify-between gap-2 mb-3 pb-2 border-b border-slate-200/80';
                    headerDiv.innerHTML = `
                        <!-- LOGO -->
                        <div class="flex items-center gap-1.5 p-1 rounded-xl border border-slate-200/80 bg-white">
                            <img src="logo.png" class="h-6 w-auto object-contain" />
                            <img src="tutwuri.png" class="h-6 w-auto object-contain" />
                            <img src="dikti.jpg" class="h-6 w-auto object-contain" />
                            <img src="fkip.jpg" class="h-6 w-auto object-contain" />
                            <img src="ppg.png" class="h-6 w-auto object-contain" />
                        </div>

                        <!-- TAB INDICATOR DENGAN NAMA TAB AKTIF -->
                        <div class="flex items-center gap-1 p-1 rounded-xl border border-slate-200/80 bg-white">
                            <span class="px-3 py-1 rounded-lg text-xs font-bold ${activeTabName === 'Beranda' ? 'bg-blue-600 text-white' : 'text-slate-400'}">Beranda</span>
                            <span class="px-3 py-1 rounded-lg text-xs font-bold ${activeTabName === 'Visi Pribadi' ? 'bg-blue-600 text-white' : 'text-slate-400'}">Visi Pribadi</span>
                            <span class="px-3 py-1 rounded-lg text-xs font-bold ${activeTabName === 'Refleksi Pengalaman' ? 'bg-blue-600 text-white' : 'text-slate-400'}">Refleksi Pengalaman Belajar</span>
                            <span class="px-3 py-1 rounded-lg text-xs font-bold ${activeTabName === 'Karya Inovasi' ? 'bg-blue-600 text-white' : 'text-slate-400'}">Karya Inovasi Pendidikan</span>
                        </div>
                    `;
                    return headerDiv;
                }

                // Ambil Konten dari Seluruh Tab secara Berurutan
                for (const tab of tabsList) {
                    const response = await fetch(tab.file);
                    if (response.ok) {
                        const htmlText = await response.text();
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = htmlText;

                        const slides = tempDiv.querySelectorAll('.slide-view');
                        slides.forEach(slide => {
                            const pageWrapper = document.createElement('div');
                            pageWrapper.className = 'pdf-page-wrapper';
                            
                            // 1. Sisipkan Header (Logo + Tab Teraplikasi)
                            pageWrapper.appendChild(createPdfHeader(tab.name));

                            // 2. Clone Slide Konten
                            const slideClone = slide.cloneNode(true);
                            slideClone.classList.add('active');

                            // Ganti Iframe Google Drive dengan Card Placeholder agar Render Tidak Rusak (CORS)
                            const iframes = slideClone.querySelectorAll('iframe');
                            iframes.forEach(iframe => {
                                const placeholder = document.createElement('div');
                                placeholder.className = 'w-full h-full bg-slate-100 border border-slate-200 rounded-xl flex flex-col items-center justify-center p-6 text-center space-y-2';
                                placeholder.innerHTML = `
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-10 h-10 text-blue-600 mx-auto">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
                                    </svg>
                                    <p class="text-xs font-bold text-slate-700">Lampiran Dokumen / Media Interaktif</p>
                                    <p class="text-[10px] text-slate-500">Dapat diakses langsung via tautan/QR Code pada dokumen ini.</p>
                                `;
                                iframe.parentNode.replaceChild(placeholder, iframe);
                            });

                            pageWrapper.appendChild(slideClone);
                            pdfContainer.appendChild(pageWrapper);
                        });
                    }
                }

                // Konfigurasi Presisi Rendering html2pdf
                const opt = {
                    margin:       0,
                    filename:     'Portofolio_dan_Karya_Inovasi_Pendidikan.pdf',
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { 
                        scale: 2, 
                        useCORS: true,
                        logging: false,
                        windowWidth: 1150
                    },
                    jsPDF:        { 
                        unit: 'mm', 
                        format: [297, 167], 
                        orientation: 'landscape' 
                    }
                };

                // Proses Render PDF
                await html2pdf().set(opt).from(pdfContainer).save();

                // Bersihkan Container Temporary
                pdfContainer.innerHTML = '';

            } catch (err) {
                alert('Gagal mengunduh PDF: ' + err.message);
            } finally {
                btnDownload.disabled = false;
                btnDownload.innerHTML = originalBtnHtml;
            }
        }

        // NAVIGASI KEYBOARD (PANAH KIRI & KANAN)
        document.addEventListener('keydown', function(event) {
            if (event.key === "ArrowRight") {
                nextSlide();
            } else if (event.key === "ArrowLeft") {
                prevSlide();
            }
        });

        // MUAT TAB BERANDA SECARA DEFAULT SAAT PERTAMA KALI DIBUKA
        window.addEventListener('DOMContentLoaded', () => {
            loadTabContent('beranda.html');
        });
    </script>
</body>
</html>
